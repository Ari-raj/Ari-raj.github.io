<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ariba Rajbhara | Y2K Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --background: #282a36;
        --surface: #44475a;
        --surface-light: #6272a4;
        --primary: #ff79c6;
        --secondary: #bd93f9;
        --accent: #50fa7b;
        --glow: #ff79c6;
        --text-primary: #f8f8f2;
        --text-secondary: #bd93f9;
        --border-color-light: #6272a4;
        --border-color-dark: #21222c;

        --font-heading: 'Press Start 2P', cursive;
        --font-body: 'VT323', monospace;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: var(--font-body);
        font-size: 20px;
        background-color: var(--background);
        color: var(--text-primary);
        overflow: hidden;
      }
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(rgba(189, 147, 249, 0.1) 1px, transparent 1px),
          linear-gradient(to right, rgba(189, 147, 249, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: scrollGrid 10s linear infinite;
        z-index: -1;
      }
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 1px, transparent 1px, transparent 3px);
        pointer-events: none;
        z-index: 1;
        opacity: 0.5;
      }
      @keyframes scrollGrid {
          from { background-position: 0 0; }
          to { background-position: -40px -40px; }
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        color: var(--accent);
        text-shadow: 2px 2px var(--secondary);
      }
      /* Scrollbar styles */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: var(--border-color-dark);
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--secondary);
        border: 2px solid var(--border-color-dark);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--primary);
      }
    </style>
  <script type="importmap">

</head>

</html>
